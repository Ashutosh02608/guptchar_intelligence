version: '3.8'

services:
  guptchar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guptchar_engine
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=${PORT:-8000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
